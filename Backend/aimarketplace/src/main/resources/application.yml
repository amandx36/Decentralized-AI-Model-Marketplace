spring:
  application:
    name: aimarketplace

  data:
    mongodb:
      uri: mongodb://root:root@localhost:27019/aimarketplace?authSource=admin

    redis:
      host: localhost
      port: 6379
      timeout: 60000ms

  output:
    ansi:
      enabled: ALWAYS

app:
  jwt:
    secret: ${JWT_SECRET:myVeryStrongkjdkfjdkfkdfkjdkfjdiuieofSecretKey123456}
    expiration-ms: 86400000
    refresh-expiration: 604800000

  cors:
    allowed-origin: http://localhost:3000,http://localhost:4200,http://localhost:5173

server:
  port: 8000
  servlet:
    context-path: /api
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:myVeryStrongkjdkfjdkfkdfkjdkfjdiuieofSecretKey123456}
  expiration: 86400000
  refresh-expiration: 604800000
